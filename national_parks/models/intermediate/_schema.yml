# models/intermediate/_schema.yml
version: 2

models:
  - name: int_park_weather_monthly
    columns:
      - name: park_code
        data_tests:
          - not_null
      - name: month_number
        data_tests:
          - not_null

  - name: int_weather_scores
    columns:
      - name: park_code
        data_tests:
          - not_null
      - name: weather_grade
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']

  - name: int_park_visits_monthly
    columns:
      - name: park_code
        data_tests:
          - not_null
      - name: month_number
        data_tests:
          - not_null

  - name: int_crowd_scores
    columns:
      - name: park_code
        data_tests:
          - not_null
      - name: crowd_grade
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']

  - name: int_hiking_scores
    columns:
      - name: park_code
        data_tests:
          - not_null
          - unique
      - name: hiking_grade
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']